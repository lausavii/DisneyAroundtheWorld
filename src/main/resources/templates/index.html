<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Disney Around The World</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">

            <div class="card shadow disney-card">

                <!-- Header -->
                <div class="disney-header p-4 text-center">
                    <h1 class="mb-2">✨Disney Around the World✨</h1>
                    <p class="mb-0">
                        Search for Disney theme parks around the world
                    </p>
                </div>

                <div class="card-body p-4">

                    <!-- Search -->
                    <h5 class="mb-3">Search for a Disney Park</h5>

                    <form action="/search" method="get" class="mb-4">

                        <div class="input-group">

                            <input type="text"
                                   name="query"
                                   class="form-control"
                                   placeholder="Enter a park or location"
                                   required>

                            <button type="submit"
                                    class="btn disney-button">
                                Search
                            </button>

                        </div>

                    </form>

                    <!-- Search Results -->
                    <div th:if="${query != null}">

                        <h5 class="mb-3">
                            Search Results
                        </h5>

                        <div th:if="${parks.isEmpty()}"
                             class="alert alert-warning">
                            No Disney parks found for
                            <strong th:text="${query}"></strong>.
                        </div>

                        <div th:each="park : ${parks}"
                             class="park-result p-3 mb-3">

                            <h4 th:text="${park.name}">
                                Disney Park
                            </h4>

                            <p class="mb-1">
                                <strong>Location:</strong>
                                <span th:text="${park.location}"></span>
                            </p>

                            <p class="mb-0">
                                <strong>Resort:</strong>
                                <span th:text="${park.resort}"></span>
                            </p>

                        </div>

                    </div>

                    <!-- Initial message -->
                    <div th:if="${query == null}"
                         class="welcome-message text-center p-4">

                        <h4>Welcome! 🏰🎡</h4>

                        <p class="mb-0">
                            Explore our page to learn about the
                            Disney Parks all over the world so you
                            can enjoy your magical trip.

                        </p>

                    </div>

                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
